<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3 PRO - Remote Traffic Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-dark: #000000;
            --bg-card: #0a0f1a;
            --accent-blue: #0066ff;
            --accent-blue-glow: #0088ff;
            --accent-blue-light: #3399ff;
            --text-white: #ffffff;
            --text-gray: #8899aa;
            --text-light: #ccd6e0;
            --border-blue: rgba(0, 102, 255, 0.3);
            --border-blue-strong: rgba(0, 102, 255, 0.6);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-white);
            line-height: 1.6;
        }
        
        /* Background Effect */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(0, 102, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(0, 102, 255, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at 0% 100%, rgba(0, 102, 255, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Language Selector */
        .lang-selector {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .lang-btn {
            background: transparent;
            border: 1px solid var(--border-blue);
            color: var(--text-gray);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .lang-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-white);
        }
        
        .lang-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: var(--text-white);
        }
        
        /* Logo Header */
        .logo-box {
            background: var(--bg-card);
            border: 1px solid var(--border-blue-strong);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 
                0 0 40px rgba(0, 102, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .logo-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--text-white) 0%, var(--accent-blue-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .logo-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: var(--accent-blue-light);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        /* Timer */
        .timer-box {
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .timer-icon {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-blue);
            border-radius: 50%;
            position: relative;
        }
        
        .timer-icon::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 6px;
            background: var(--accent-blue);
            transform: translate(-50%, -100%) rotate(0deg);
            transform-origin: bottom center;
            animation: tick 60s linear infinite;
        }
        
        @keyframes tick {
            to { transform: translate(-50%, -100%) rotate(360deg); }
        }
        
        .timer-text {
            font-size: 14px;
            color: var(--text-light);
        }
        
        .timer-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--accent-blue-light);
        }
        
        .timer-expired {
            border-color: #ff4444;
        }
        
        .timer-expired .timer-text,
        .timer-expired .timer-value {
            color: #ff6666;
        }
        
        /* Platform Tabs */
        .platform-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .platform-tab {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .platform-tab:hover {
            border-color: var(--accent-blue);
        }
        
        .platform-tab.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.3);
        }
        
        .platform-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 8px;
        }
        
        .platform-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .platform-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-white);
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        
        .card-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, #0044cc 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-white);
        }
        
        .card-subtitle {
            font-size: 13px;
            color: var(--text-gray);
        }
        
        .card-exit-node {
            border-color: #00cc66;
        }
        
        .card-exit-node .card-icon {
            background: linear-gradient(135deg, #00cc66 0%, #009944 100%);
        }
        
        .card-exit-node .card-title {
            color: #00ff88;
        }
        
        /* Key Display */
        .key-display {
            background: #000;
            border: 1px solid var(--border-blue);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
        }
        
        .key-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-blue-light);
            word-break: break-all;
            line-height: 1.5;
        }
        
        .key-display-green {
            border-color: rgba(0, 204, 102, 0.4);
        }
        
        .key-display-green .key-value {
            color: #00ff88;
            font-size: 16px;
            text-align: center;
        }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, #0044cc 100%);
            color: white;
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.5);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-blue);
            color: var(--text-white);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 102, 255, 0.1);
        }
        
        .btn-green {
            background: linear-gradient(135deg, #00cc66 0%, #009944 100%);
        }
        
        .btn-green:hover {
            box-shadow: 0 0 20px rgba(0, 204, 102, 0.5);
        }
        
        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        /* Steps */
        .steps-section {
            margin-top: 20px;
        }
        
        .steps-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-white);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-blue);
        }
        
        .step {
            display: flex;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .step:last-child {
            border-bottom: none;
        }
        
        .step-number {
            width: 28px;
            height: 28px;
            background: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        
        .step-exit-node .step-number {
            background: #00cc66;
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-white);
            margin-bottom: 4px;
        }
        
        .step-exit-node .step-title {
            color: #00ff88;
        }
        
        .step-desc {
            font-size: 13px;
            color: var(--text-gray);
        }
        
        .step-highlight {
            display: inline-block;
            background: rgba(0, 102, 255, 0.2);
            border: 1px solid var(--border-blue);
            border-radius: 6px;
            padding: 6px 12px;
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-blue-light);
        }
        
        .step-highlight-green {
            background: rgba(0, 204, 102, 0.15);
            border-color: rgba(0, 204, 102, 0.4);
            color: #00ff88;
        }
        
        /* Download Buttons */
        .download-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .download-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            background: #111;
            border: 1px solid var(--border-blue);
            border-radius: 8px;
            color: var(--text-white);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .download-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 102, 255, 0.1);
        }
        
        .download-btn img {
            width: 18px;
            height: 18px;
        }
        
        /* Platform Content */
        .platform-content {
            display: none;
        }
        
        .platform-content.active {
            display: block;
        }
        
        /* Success Box */
        .success-box {
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
        
        .success-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, #0044cc 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
        }
        
        .success-icon svg {
            width: 26px;
            height: 26px;
            fill: white;
        }
        
        .success-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-white);
            margin-bottom: 8px;
        }
        
        .success-desc {
            font-size: 13px;
            color: var(--text-gray);
        }
        
        /* Error State */
        .error-box {
            background: var(--bg-card);
            border: 1px solid #ff4444;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }
        
        .error-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .error-icon svg {
            width: 30px;
            height: 30px;
            fill: white;
        }
        
        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: #ff6666;
            margin-bottom: 10px;
        }
        
        .error-desc {
            font-size: 14px;
            color: var(--text-gray);
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }
        
        .footer-text {
            font-size: 12px;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .footer-text svg {
            width: 14px;
            height: 14px;
            fill: var(--accent-blue);
        }
    </style>
</head>

        // Apple and Android logos (SVG base64)
        const appleLogo = `<svg viewBox="0 0 24 24" fill="white"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>`;
        const androidLogo = `<svg viewBox="0 0 24 24" fill="white"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 1.23 12.95 1 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 3.26 6 5.01 6 7h12c0-1.99-.97-3.75-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg>`;
        
        function t(key) {
            return translations[currentLang][key] || key;
        }
        
        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === lang.toUpperCase());
            });
            renderContent();
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = `<svg><use href="#icon-check"/></svg> ${t('copied')}`;
                setTimeout(() => {
                    button.innerHTML = originalText;
                }, 2000);
            });
        }
        
        function showPlatform(platform) {
            document.querySelectorAll('.platform-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.platform === platform);
            });
            document.querySelectorAll('.platform-content').forEach(content => {
                content.classList.toggle('active', content.id === `content-${platform}`);
            });
        }
        
        function renderContent() {
            const urlParams = new URLSearchParams(window.location.search);
            const authKey = urlParams.get('authkey') || urlParams.get('key') || '';
            const exitNode = urlParams.get('exitnode') || urlParams.get('exit') || '';
            const contentDiv = document.getElementById('content');
            
            // Update static translations
            document.querySelector('[data-i18n="logoSubtitle"]').textContent = t('logoSubtitle');
            document.querySelector('[data-i18n="footer"]').textContent = t('footer');
            
            // Detect platform
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const defaultPlatform = isIOS ? 'ios' : 'android';
            
            const isValidKey = authKey && authKey.startsWith('tskey-');
            
            if (isValidKey) {
                contentDiv.innerHTML = `
                    <!-- Timer -->
                    <div class="timer-box" id="timer-box">
                        <div class="timer-icon"></div>
                        <span class="timer-text">${t('timerLabel')}: <span class="timer-value" id="timer-value">${formatTime(timeRemaining)}</span></span>
                    </div>
                    
                    <!-- Platform Tabs -->
                    <div class="platform-tabs">
                        <div class="platform-tab ${defaultPlatform === 'ios' ? 'active' : ''}" data-platform="ios" onclick="showPlatform('ios')">
                            <div class="platform-icon">${appleLogo}</div>
                            <div class="platform-name">iPhone / iPad</div>
                        </div>
                        <div class="platform-tab ${defaultPlatform === 'android' ? 'active' : ''}" data-platform="android" onclick="showPlatform('android')">
                            <div class="platform-icon">${androidLogo}</div>
                            <div class="platform-name">Android</div>
                        </div>
                    </div>
                    
                    <!-- Auth Key Card -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">
                                <svg><use href="#icon-key"/></svg>
                            </div>
                            <div>
                                <div class="card-title">${t('authKeyTitle')}</div>
                                <div class="card-subtitle">${t('authKeySubtitle')}</div>
                            </div>
                        </div>
                        <div class="key-display">
                            <div class="key-value">${authKey}</div>
                        </div>
                        <button class="btn btn-primary" onclick="copyToClipboard('${authKey}', this)">
                            <svg><use href="#icon-copy"/></svg>
                            ${t('copyKey')}
                        </button>
                    </div>
                    
                    ${exitNode ? `
                    <!-- Exit Node Card -->
                    <div class="card card-exit-node">
                        <div class="card-header">
                            <div class="card-icon">
                                <svg><use href="#icon-globe"/></svg>
                            </div>
                            <div>
                                <div class="card-title">${t('exitNodeTitle')}</div>
                                <div class="card-subtitle">${t('exitNodeSubtitle')}</div>
                            </div>
                        </div>
                        <div class="key-display key-display-green">
                            <div class="key-value">${exitNode}</div>
                        </div>
                        <button class="btn btn-green" onclick="copyToClipboard('${exitNode}', this)">
                            <svg><use href="#icon-copy"/></svg>
                            ${t('copyName')}
                        </button>
                    </div>
                    ` : ''}
                    
                    <!-- iOS Content -->
                    <div id="content-ios" class="platform-content ${defaultPlatform === 'ios' ? 'active' : ''}">
                        <a href="tailscale://" class="btn btn-secondary" style="margin-bottom: 16px;">
                            <svg><use href="#icon-open"/></svg>
                            ${t('openApp')}
                        </a>
                        
                        <div class="steps-section">
                            <div class="steps-title">${t('stepsTitle')}</div>
                            
                            <div class="step">
                                <div class="step-number">1</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step1Title')}</div>
                                    <div class="step-desc">${t('step1Desc')}</div>
                                    <div class="download-row">
                                        <a href="https://apps.apple.com/app/tailscale/id1470499037" class="download-btn" target="_blank">
                                            ${appleLogo.replace('fill="white"', 'fill="#999"')}
                                            App Store
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">2</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step2Title')}</div>
                                    <div class="step-desc">${t('step2Desc')}</div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">3</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step3Title')}</div>
                                    <div class="step-desc">${t('step3DescIOS')}</div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">4</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step4Title')}</div>
                                    <div class="step-desc">${t('step4Desc')}</div>
                                </div>
                            </div>
                            
                            ${exitNode ? `
                            <div class="step step-exit-node">
                                <div class="step-number">5</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step5Title')}</div>
                                    <div class="step-desc">${t('step5DescIOS')}</div>
                                    <div class="step-highlight step-highlight-green">${exitNode}</div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    <!-- Android Content -->
                    <div id="content-android" class="platform-content ${defaultPlatform === 'android' ? 'active' : ''}">
                        <a href="tailscale://" class="btn btn-secondary" style="margin-bottom: 16px;">
                            <svg><use href="#icon-open"/></svg>
                            ${t('openApp')}
                        </a>
                        
                        <div class="steps-section">
                            <div class="steps-title">${t('stepsTitle')}</div>
                            
                            <div class="step">
                                <div class="step-number">1</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step1Title')}</div>
                                    <div class="step-desc">${t('step1Desc')}</div>
                                    <div class="download-row">
                                        <a href="https://play.google.com/store/apps/details?id=com.tailscale.ipn" class="download-btn" target="_blank">
                                            ${androidLogo.replace('fill="white"', 'fill="#999"')}
                                            Play Store
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">2</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step2Title')}</div>
                                    <div class="step-desc">${t('step2Desc')}</div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">3</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step3Title')}</div>
                                    <div class="step-desc">${t('step3DescAndroid')}</div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">4</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step4Title')}</div>
                                    <div class="step-desc">${t('step4Desc')}</div>
                                </div>
                            </div>
                            
                            ${exitNode ? `
                            <div class="step step-exit-node">
                                <div class="step-number">5</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step5Title')}</div>
                                    <div class="step-desc">${t('step5DescAndroid')}</div>
                                    <div class="step-highlight step-highlight-green">${exitNode}</div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    <!-- Success Box -->
                    <div class="success-box">
                        <div class="success-icon">
                            <svg><use href="#icon-lock"/></svg>
                        </div>
                        <div class="success-title">${t('successTitle')}</div>
                        <div class="success-desc">${t('successDesc')}</div>
                    </div>
                `;
                
                // Start timer
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    const timerValue = document.getElementById('timer-value');
                    const timerBox = document.getElementById('timer-box');
                    
                    if (timerValue) {
                        timerValue.textContent = formatTime(timeRemaining);
                    }
                    
                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        if (timerBox) {
                            timerBox.classList.add('timer-expired');
                            timerBox.innerHTML = `
                                <div class="timer-icon" style="border-color: #ff4444;"></div>
                                <span class="timer-text">${t('timerExpired')}</span>
                            `;
                        }
                    }
                }, 1000);
                
            } else {
                // Error state
                contentDiv.innerHTML = `
                    <div class="error-box">
                        <div class="error-icon">
                            <svg><use href="#icon-error"/></svg>
                        </div>
                        <div class="error-title">${t('errorTitle')}</div>
                        <div class="error-desc">${t('errorDesc')}</div>
                    </div>
                `;
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', renderContent);
    </script>
</body>
</html>
