<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEFF M3 Pro - Connessione Sicura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #111111;
            --accent-cyan: #00f0ff;
            --accent-purple: #a855f7;
            --accent-green: #00ff88;
            --accent-red: #ff4757;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #222222;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        /* Animated Background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .glow-orb {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        
        .glow-orb-1 {
            background: var(--accent-cyan);
            top: -100px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }
        
        .glow-orb-2 {
            background: var(--accent-purple);
            bottom: -100px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Header */
        .header {
            text-align: center;
            padding: 30px 0;
        }
        
        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(0,240,255,0.3);
        }
        
        .logo-icon {
            font-size: 40px;
        }
        
        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        .brand-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        /* Language Switcher */
        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .lang-btn {
            padding: 8px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lang-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--text-primary);
        }
        
        .lang-btn.active {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-color: transparent;
            color: #000;
        }
        
        /* Timer */
        .timer-container {
            background: linear-gradient(135deg, rgba(255,71,87,0.1), rgba(168,85,247,0.1));
            border: 1px solid rgba(255,71,87,0.3);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .timer-icon {
            font-size: 1.5rem;
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .timer-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-red);
        }
        
        .timer-expired {
            background: rgba(255,71,87,0.2);
            border-color: var(--accent-red);
        }
        
        /* Platform Tabs */
        .platform-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .platform-tab {
            flex: 1;
            padding: 15px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .platform-tab:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }
        
        .platform-tab.active {
            background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(168,85,247,0.1));
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0,240,255,0.2);
        }
        
        .platform-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        
        .platform-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        /* Auth Key Card */
        .key-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .key-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .key-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        
        .key-title {
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .key-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .key-display {
            background: #000;
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 15px;
            position: relative;
            margin-bottom: 15px;
        }
        
        .key-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent-green);
            word-break: break-all;
            line-height: 1.5;
            padding-right: 10px;
        }
        
        .copy-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,240,255,0.3);
        }
        
        .copy-btn:active {
            transform: translateY(0);
        }
        
        .copy-btn.copied {
            background: linear-gradient(135deg, var(--accent-green), #00cc6a);
        }
        
        /* Open App Button */
        .open-app-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid var(--accent-purple);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            text-decoration: none;
        }
        
        .open-app-btn:hover {
            background: linear-gradient(135deg, var(--accent-purple), #7c3aed);
            border-color: var(--accent-purple);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168,85,247,0.3);
        }
        
        /* Steps */
        .steps-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .steps-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .steps-icon {
            font-size: 1.5rem;
        }
        
        .steps-title {
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .step {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,240,255,0.03);
            border-radius: 12px;
            border-left: 3px solid var(--accent-cyan);
            transition: all 0.3s ease;
        }
        
        .step:hover {
            background: rgba(0,240,255,0.08);
            transform: translateX(5px);
        }
        
        .step:last-child {
            margin-bottom: 0;
        }
        
        .step-number {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: #000;
            flex-shrink: 0;
        }
        
        .step-content {
            flex: 1;
        }
        
        .step-title {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        
        .step-desc {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.5;
        }
        
        .step-success {
            border-left-color: var(--accent-green);
        }
        
        .step-success .step-number {
            background: var(--accent-green);
        }
        
        /* Download Buttons */
        .download-section {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .download-btn {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .download-btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0,240,255,0.1);
            transform: translateY(-2px);
        }
        
        /* Success Card */
        .success-card {
            background: linear-gradient(135deg, rgba(0,255,136,0.1), rgba(0,240,255,0.05));
            border: 1px solid rgba(0,255,136,0.3);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }
        
        .success-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .success-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 10px;
        }
        
        .success-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        /* Error Card */
        .error-card {
            background: rgba(255,71,87,0.1);
            border: 1px solid rgba(255,71,87,0.3);
            border-radius: 16px;
            padding: 40px 25px;
            text-align: center;
        }
        
        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-red);
            margin-bottom: 15px;
        }
        
        .error-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        
        .footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
        
        /* Hide platform content */
        .platform-content {
            display: none;
        }
        
        .platform-content.active {
            display: block;
        }
        
        /* Responsive */
        @media (max-width: 400px) {
            .container {
                padding: 15px;
            }
            
            .brand-name {
                font-size: 1.5rem;
            }
            
            .key-value {
                font-size: 0.55rem;
            }
            
            .platform-icon {
                font-size: 1.5rem;
            }
            
            .platform-name {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <span class="logo-icon">🛡️</span>
            </div>
            <h1 class="brand-name">MEFF M3 Pro</h1>
            <p class="brand-subtitle" data-i18n="subtitle">Connessione Sicura per Analisi</p>
        </div>
        
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="setLanguage('it')">🇮🇹 Italiano</button>
            <button class="lang-btn" onclick="setLanguage('en')">🇬🇧 English</button>
        </div>
        
        <div id="content">
            <!-- Content loaded by JavaScript -->
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>🔒 <span data-i18n="footerSecure">Connessione crittografata end-to-end</span></p>
            <p style="margin-top: 8px;">MEFF M3 Pro © 2024 - <a href="https://m2look.com">m2look.com</a></p>
        </div>
    </div>

    <script>
        // Translations
        const translations = {
            it: {
                subtitle: "Connessione Sicura per Analisi",
                timerLabel: "Chiave valida per",
                timerExpired: "Chiave scaduta! Richiedi nuovo QR code",
                selectDevice: "Seleziona dispositivo",
                authKeyTitle: "Chiave di Autenticazione",
                authKeySubtitle: "Copia e incolla nell'app Tailscale",
                copyKey: "📋 COPIA CHIAVE",
                copied: "✓ COPIATO!",
                openApp: "🚀 APRI APP TAILSCALE",
                stepsTitle: "Come connettersi",
                step1Title: "Scarica Tailscale",
                step1Desc: "Se non l'hai già, scarica l'app gratuita",
                step2Title: "Apri l'app",
                step2Desc: "Tocca il pulsante sopra o apri Tailscale manualmente",
                step3Title: "Inserisci la chiave",
                step3DescIOS: "Menu ⋮ in alto → \"Use auth key\" → Incolla",
                step3DescAndroid: "Menu ⋮ → \"Use auth key\" → Incolla la chiave",
                step4Title: "Consenti VPN",
                step4Desc: "Tocca \"Consenti\" quando richiesto",
                step5Title: "Connesso!",
                step5Desc: "Vedrai \"Connected\" - Ora il tecnico può analizzare il traffico",
                successTitle: "Dopo la connessione",
                successDesc: "Il tecnico potrà analizzare il traffico di rete in modo sicuro. Mantieni l'app Tailscale aperta durante la scansione.",
                errorTitle: "Link non valido",
                errorDesc: "Questo link non contiene una chiave valida. Contatta il tecnico per ricevere un nuovo QR code.",
                downloadIOS: "App Store",
                downloadAndroid: "Play Store",
                footerSecure: "Connessione crittografata end-to-end"
            },
            en: {
                subtitle: "Secure Connection for Analysis",
                timerLabel: "Key valid for",
                timerExpired: "Key expired! Request new QR code",
                selectDevice: "Select your device",
                authKeyTitle: "Authentication Key",
                authKeySubtitle: "Copy and paste in Tailscale app",
                copyKey: "📋 COPY KEY",
                copied: "✓ COPIED!",
                openApp: "🚀 OPEN TAILSCALE APP",
                stepsTitle: "How to connect",
                step1Title: "Download Tailscale",
                step1Desc: "If you don't have it, download the free app",
                step2Title: "Open the app",
                step2Desc: "Tap the button above or open Tailscale manually",
                step3Title: "Enter the key",
                step3DescIOS: "Menu ⋮ at top → \"Use auth key\" → Paste",
                step3DescAndroid: "Menu ⋮ → \"Use auth key\" → Paste the key",
                step4Title: "Allow VPN",
                step4Desc: "Tap \"Allow\" when prompted",
                step5Title: "Connected!",
                step5Desc: "You'll see \"Connected\" - Now the technician can analyze traffic",
                successTitle: "After connecting",
                successDesc: "The technician will be able to analyze network traffic securely. Keep Tailscale app open during the scan.",
                errorTitle: "Invalid link",
                errorDesc: "This link doesn't contain a valid key. Contact the technician for a new QR code.",
                downloadIOS: "App Store",
                downloadAndroid: "Play Store",
                footerSecure: "End-to-end encrypted connection"
            }
        };
        
        let currentLang = 'it';
        let timeRemaining = 3600;
        let timerInterval = null;
        
        // Detect language from browser
        const browserLang = navigator.language.substring(0, 2);
        if (browserLang === 'en') {
            currentLang = 'en';
        }
        
        function t(key) {
            return translations[currentLang][key] || translations['it'][key] || key;
        }
        
        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderContent();
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = `<span style="font-size: 1.2rem;">✓</span> ${t('copied')}`;
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('copied');
                }, 2500);
            }).catch(() => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                btn.innerHTML = `<span style="font-size: 1.2rem;">✓</span> ${t('copied')}`;
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = `<span style="font-size: 1.2rem;">📋</span> ${t('copyKey')}`;
                    btn.classList.remove('copied');
                }, 2500);
            });
        }
        
        function showPlatform(platform) {
            document.querySelectorAll('.platform-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.platform-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`[data-platform="${platform}"]`).classList.add('active');
            document.getElementById(`content-${platform}`).classList.add('active');
        }
        
        function getDeepLink(authKey, platform) {
            // Tailscale deep links
            if (platform === 'ios') {
                return `tailscale://`;
            } else {
                return `tailscale://`;
            }
        }
        
        function renderContent() {
            const urlParams = new URLSearchParams(window.location.search);
            const authKey = urlParams.get('authkey') || urlParams.get('key') || '';
            const contentDiv = document.getElementById('content');
            
            // Update static translations
            document.querySelector('[data-i18n="subtitle"]').textContent = t('subtitle');
            document.querySelector('[data-i18n="footerSecure"]').textContent = t('footerSecure');
            
            // Detect platform
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);
            const defaultPlatform = isIOS ? 'ios' : 'android';
            
            if (authKey && authKey.startsWith('tskey-')) {
                contentDiv.innerHTML = `
                    <!-- Timer -->
                    <div class="timer-container" id="timer-container">
                        <span class="timer-icon">⏱️</span>
                        <span class="timer-text">
                            <span data-i18n-timer="label">${t('timerLabel')}</span>: 
                            <strong id="timer-value">${formatTime(timeRemaining)}</strong>
                        </span>
                    </div>
                    
                    <!-- Platform Tabs -->
                    <div class="platform-tabs">
                        <div class="platform-tab ${defaultPlatform === 'ios' ? 'active' : ''}" data-platform="ios" onclick="showPlatform('ios')">
                            <div class="platform-icon">🍎</div>
                            <div class="platform-name">iPhone / iPad</div>
                        </div>
                        <div class="platform-tab ${defaultPlatform === 'android' ? 'active' : ''}" data-platform="android" onclick="showPlatform('android')">
                            <div class="platform-icon">🤖</div>
                            <div class="platform-name">Android</div>
                        </div>
                    </div>
                    
                    <!-- Auth Key Card -->
                    <div class="key-card">
                        <div class="key-card-header">
                            <div class="key-icon">🔑</div>
                            <div>
                                <div class="key-title">${t('authKeyTitle')}</div>
                                <div class="key-subtitle">${t('authKeySubtitle')}</div>
                            </div>
                        </div>
                        <div class="key-display">
                            <div class="key-value">${authKey}</div>
                        </div>
                        <button class="copy-btn" onclick="copyToClipboard('${authKey}', this)">
                            <span style="font-size: 1.2rem;">📋</span> ${t('copyKey')}
                        </button>
                    </div>
                    
                    <!-- Open App Button - iOS -->
                    <div id="content-ios" class="platform-content ${defaultPlatform === 'ios' ? 'active' : ''}">
                        <a href="tailscale://" class="open-app-btn">
                            <span style="font-size: 1.3rem;">🚀</span> ${t('openApp')}
                        </a>
                        
                        <div class="steps-container">
                            <div class="steps-header">
                                <span class="steps-icon">📱</span>
                                <span class="steps-title">${t('stepsTitle')}</span>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">1</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step1Title')}</div>
                                    <div class="step-desc">${t('step1Desc')}</div>
                                    <div class="download-section">
                                        <a href="https://apps.apple.com/app/tailscale/id1470499037" class="download-btn" target="_blank">
                                            🍎 ${t('downloadIOS')}
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">2</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step2Title')}</div>
                                    <div class="step-desc">${t('step2Desc')}</div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">3</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step3Title')}</div>
                                    <div class="step-desc">${t('step3DescIOS')}</div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">4</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step4Title')}</div>
                                    <div class="step-desc">${t('step4Desc')}</div>
                                </div>
                            </div>
                            
                            <div class="step step-success">
                                <div class="step-number">✓</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step5Title')}</div>
                                    <div class="step-desc">${t('step5Desc')}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Open App Button - Android -->
                    <div id="content-android" class="platform-content ${defaultPlatform === 'android' ? 'active' : ''}">
                        <a href="tailscale://" class="open-app-btn">
                            <span style="font-size: 1.3rem;">🚀</span> ${t('openApp')}
                        </a>
                        
                        <div class="steps-container">
                            <div class="steps-header">
                                <span class="steps-icon">📱</span>
                                <span class="steps-title">${t('stepsTitle')}</span>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">1</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step1Title')}</div>
                                    <div class="step-desc">${t('step1Desc')}</div>
                                    <div class="download-section">
                                        <a href="https://play.google.com/store/apps/details?id=com.tailscale.ipn" class="download-btn" target="_blank">
                                            🤖 ${t('downloadAndroid')}
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">2</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step2Title')}</div>
                                    <div class="step-desc">${t('step2Desc')}</div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">3</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step3Title')}</div>
                                    <div class="step-desc">${t('step3DescAndroid')}</div>
                                </div>
                            </div>
                            
                            <div class="step">
                                <div class="step-number">4</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step4Title')}</div>
                                    <div class="step-desc">${t('step4Desc')}</div>
                                </div>
                            </div>
                            
                            <div class="step step-success">
                                <div class="step-number">✓</div>
                                <div class="step-content">
                                    <div class="step-title">${t('step5Title')}</div>
                                    <div class="step-desc">${t('step5Desc')}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Success Info -->
                    <div class="success-card">
                        <div class="success-icon">🔒</div>
                        <div class="success-title">${t('successTitle')}</div>
                        <div class="success-desc">${t('successDesc')}</div>
                    </div>
                `;
                
                // Start timer
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    const timerValue = document.getElementById('timer-value');
                    const timerContainer = document.getElementById('timer-container');
                    
                    if (timerValue) {
                        timerValue.textContent = formatTime(timeRemaining);
                    }
                    
                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        if (timerContainer) {
                            timerContainer.classList.add('timer-expired');
                            timerContainer.innerHTML = `
                                <span class="timer-icon">❌</span>
                                <span class="timer-text">${t('timerExpired')}</span>
                            `;
                        }
                    }
                }, 1000);
                
            } else {
                // No valid key
                contentDiv.innerHTML = `
                    <div class="error-card">
                        <div class="error-icon">⚠️</div>
                        <div class="error-title">${t('errorTitle')}</div>
                        <div class="error-desc">${t('errorDesc')}</div>
                    </div>
                `;
            }
        }
        
        // Initial render
        document.addEventListener('DOMContentLoaded', () => {
            // Set initial language button state
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((currentLang === 'it' && btn.textContent.includes('Italiano')) ||
                    (currentLang === 'en' && btn.textContent.includes('English'))) {
                    btn.classList.add('active');
                }
            });
            renderContent();
        });
    </script>
</body>
</html>
