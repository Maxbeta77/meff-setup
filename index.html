<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEFF M3 Pro - Setup Connessione Remota</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo p {
            color: #888;
            margin-top: 5px;
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .card h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,212,255,0.05);
            border-radius: 12px;
            border-left: 3px solid #00d4ff;
        }
        
        .step-number {
            background: #00d4ff;
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .step-content h3 {
            margin-bottom: 8px;
            font-size: 1rem;
        }
        
        .step-content p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.3);
        }
        
        .command-box {
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            position: relative;
        }
        
        .command-box code {
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            word-break: break-all;
            display: block;
            padding-right: 40px;
        }
        
        .copy-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        
        .copy-btn:hover {
            background: #00b8e6;
        }
        
        .copy-btn.copied {
            background: #00ff88;
        }
        
        .warning {
            background: rgba(255,193,7,0.1);
            border: 1px solid rgba(255,193,7,0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .warning p {
            color: #ffc107;
            font-size: 0.9rem;
        }
        
        .success-card {
            background: rgba(0,255,136,0.1);
            border: 1px solid rgba(0,255,136,0.3);
        }
        
        .success-card h2 {
            color: #00ff88;
        }
        
        .timer {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,193,7,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #ffc107;
            margin-bottom: 15px;
        }
        
        .no-key {
            text-align: center;
            padding: 40px;
        }
        
        .no-key h2 {
            color: #ff6b6b;
            margin-bottom: 15px;
        }
        
        .no-key p {
            color: #888;
        }
        
        .platform-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .platform-tab {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .platform-tab:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .platform-tab.active {
            background: rgba(0,212,255,0.2);
            border-color: #00d4ff;
        }
        
        .platform-content {
            display: none;
        }
        
        .platform-content.active {
            display: block;
        }

        @media (max-width: 480px) {
            .logo h1 {
                font-size: 1.5rem;
            }
            
            .command-box code {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🛡️ MEFF M3 Pro</h1>
            <p>Setup Connessione Sicura</p>
        </div>
        
        <div id="content">
            <!-- Content will be loaded by JavaScript -->
        </div>
    </div>

    <script>
        // Leggi parametri dall'URL
        const urlParams = new URLSearchParams(window.location.search);
        const authKey = urlParams.get('authkey') || urlParams.get('key') || '';
        
        const contentDiv = document.getElementById('content');
        
        // Tempo rimanente (1 ora = 3600 secondi)
        let timeRemaining = 3600;
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function copyCommand(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✓ Copiato!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copia';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
        
        function showPlatform(platform) {
            document.querySelectorAll('.platform-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.platform-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelector(`[data-platform="${platform}"]`).classList.add('active');
            document.getElementById(`content-${platform}`).classList.add('active');
        }
        
        if (authKey && authKey.startsWith('tskey-')) {
            // Auth Key valida - mostra istruzioni
            const command = `tailscale up --authkey=${authKey}`;
            
            // Rileva piattaforma automaticamente
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);
            const defaultPlatform = isIOS ? 'ios' : (isAndroid ? 'android' : 'ios');
            
            contentDiv.innerHTML = `
                <div class="timer" id="timer">
                    ⏱️ Chiave valida per: <strong>${formatTime(timeRemaining)}</strong>
                </div>
                
                <div class="card">
                    <h2>📱 Seleziona il tuo dispositivo</h2>
                    
                    <div class="platform-tabs">
                        <div class="platform-tab ${defaultPlatform === 'ios' ? 'active' : ''}" data-platform="ios" onclick="showPlatform('ios')">
                            🍎 iPhone/iPad
                        </div>
                        <div class="platform-tab ${defaultPlatform === 'android' ? 'active' : ''}" data-platform="android" onclick="showPlatform('android')">
                            🤖 Android
                        </div>
                    </div>
                    
                    <!-- iOS -->
                    <div id="content-ios" class="platform-content ${defaultPlatform === 'ios' ? 'active' : ''}">
                        <div class="step">
                            <div class="step-number">1</div>
                            <div class="step-content">
                                <h3>Scarica Tailscale</h3>
                                <p>Installa l'app Tailscale dall'App Store.</p>
                                <a href="https://apps.apple.com/app/tailscale/id1470499037" 
                                   class="download-btn" target="_blank">
                                    ⬇️ Scarica da App Store
                                </a>
                            </div>
                        </div>
                        
                        <div class="step">
                            <div class="step-number">2</div>
                            <div class="step-content">
                                <h3>Apri l'app e accedi</h3>
                                <p>Apri Tailscale e tocca <strong>"Get Started"</strong> o <strong>"Inizia"</strong>.</p>
                            </div>
                        </div>
                        
                        <div class="step">
                            <div class="step-number">3</div>
                            <div class="step-content">
                                <h3>Usa Auth Key</h3>
                                <p>Tocca il menu <strong>⋮</strong> in alto a destra → <strong>"Use auth key"</strong></p>
                                <p style="margin-top:8px;">Poi incolla questa chiave:</p>
                                <div class="command-box">
                                    <code style="font-size: 0.65rem; word-break: break-all;">${authKey}</code>
                                    <button class="copy-btn" onclick="copyCommand(this, '${authKey}')">Copia</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="step">
                            <div class="step-number">4</div>
                            <div class="step-content">
                                <h3>Consenti VPN</h3>
                                <p>Quando richiesto, tocca <strong>"Consenti"</strong> per permettere la configurazione VPN.</p>
                            </div>
                        </div>
                        
                        <div class="step" style="border-left-color: #00ff88;">
                            <div class="step-number" style="background: #00ff88;">✓</div>
                            <div class="step-content">
                                <h3>Connesso!</h3>
                                <p>Quando vedi <strong>"Connected"</strong> o l'icona VPN in alto, sei pronto per la scansione!</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- ANDROID -->
                    <div id="content-android" class="platform-content ${defaultPlatform === 'android' ? 'active' : ''}">
                        <div class="step">
                            <div class="step-number">1</div>
                            <div class="step-content">
                                <h3>Scarica Tailscale</h3>
                                <p>Installa l'app Tailscale dal Play Store.</p>
                                <a href="https://play.google.com/store/apps/details?id=com.tailscale.ipn" 
                                   class="download-btn" target="_blank">
                                    ⬇️ Scarica da Play Store
                                </a>
                            </div>
                        </div>
                        
                        <div class="step">
                            <div class="step-number">2</div>
                            <div class="step-content">
                                <h3>Apri l'app</h3>
                                <p>Apri Tailscale e tocca <strong>"Get Started"</strong> o <strong>"Inizia"</strong>.</p>
                            </div>
                        </div>
                        
                        <div class="step">
                            <div class="step-number">3</div>
                            <div class="step-content">
                                <h3>Usa Auth Key</h3>
                                <p>Tocca il menu <strong>⋮</strong> in alto a destra → <strong>"Use auth key"</strong></p>
                                <p style="margin-top:8px;">Poi incolla questa chiave:</p>
                                <div class="command-box">
                                    <code style="font-size: 0.65rem; word-break: break-all;">${authKey}</code>
                                    <button class="copy-btn" onclick="copyCommand(this, '${authKey}')">Copia</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="step">
                            <div class="step-number">4</div>
                            <div class="step-content">
                                <h3>Consenti VPN</h3>
                                <p>Quando richiesto, tocca <strong>"OK"</strong> o <strong>"Consenti"</strong> per attivare la VPN.</p>
                            </div>
                        </div>
                        
                        <div class="step" style="border-left-color: #00ff88;">
                            <div class="step-number" style="background: #00ff88;">✓</div>
                            <div class="step-content">
                                <h3>Connesso!</h3>
                                <p>Quando vedi <strong>"Connected"</strong> e l'icona 🔑 in alto, sei pronto per la scansione!</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="warning">
                        <p>⚠️ <strong>Importante:</strong> Questa chiave scade tra 1 ora ed è monouso. Se scade, richiedi un nuovo QR code al tecnico.</p>
                    </div>
                </div>
                
                <div class="card success-card">
                    <h2>✅ Dopo la connessione</h2>
                    <p style="color: #aaa; line-height: 1.6;">
                        Una volta connesso, il tecnico potrà analizzare il traffico di rete del tuo dispositivo 
                        in modo sicuro. La connessione è crittografata end-to-end.
                    </p>
                    <p style="color: #888; font-size: 0.85rem; margin-top: 10px;">
                        💡 Mantieni l'app Tailscale aperta durante la scansione.
                    </p>
                </div>
            `;
            
            // Timer countdown
            const timerInterval = setInterval(() => {
                timeRemaining--;
                const timerEl = document.getElementById('timer');
                if (timerEl) {
                    timerEl.innerHTML = `⏱️ Chiave valida per: <strong>${formatTime(timeRemaining)}</strong>`;
                }
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    if (timerEl) {
                        timerEl.innerHTML = '❌ <strong>Chiave scaduta!</strong> Richiedi un nuovo link.';
                        timerEl.style.background = 'rgba(255,107,107,0.2)';
                        timerEl.style.color = '#ff6b6b';
                    }
                }
            }, 1000);
            
        } else if (authKey) {
            // Vecchio formato (invite link) - redirect
            contentDiv.innerHTML = `
                <div class="card">
                    <h2>🔄 Reindirizzamento...</h2>
                    <p style="color: #aaa;">Verrai reindirizzato alla pagina di login Tailscale.</p>
                </div>
            `;
            setTimeout(() => {
                window.location.href = authKey;
            }, 1500);
        } else {
            // Nessuna chiave
            contentDiv.innerHTML = `
                <div class="card no-key">
                    <h2>⚠️ Link non valido</h2>
                    <p>Questo link non contiene una chiave di accesso valida.</p>
                    <p style="margin-top: 15px;">Contatta il tecnico per ricevere un nuovo link.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
